[project]
name = "echo-tts"
version = "0.3.0"
description = "Text to chaptered speech: a TTS library with pluggable engines, plus an audiobook app"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# The library: `from echo import speak_chapters`. Ranges, not pins — a library that
# pins exactly cannot share an environment with its caller. The app's pinned,
# tested set lives in requirements*.txt. No PDF, EPUB or HTML parsing here; that
# is the app's, under the `app` extra.
dependencies = [
    "edge-tts>=7.2,<8",
    "mutagen>=1.47,<2",
    # A static ffmpeg for macOS, Linux and Windows, so a pip install is a working
    # install with no `brew install` step.
    "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
# Gemini TTS + Google Cloud TTS engines (and, for the app, research and the gemini normalizer).
google = ["google-genai>=2.14,<3", "google-cloud-texttospeech>=2.37,<3"]
api = ["echo-tts[google]"]
# On-device synthesis on Apple Silicon. Kokoro works on Python 3.13 only today;
# see requirements-local-llm.txt for the misaki/spaCy/espeak setup it needs.
mlx = ["mlx-audio>=0.4.6,<0.5"]
local = ["echo-tts[mlx]"]
# Offline synthesis on any OS and Python, CPU only: onnxruntime plus a bundled espeak-ng
# (~180 MB). Voices (~60 MB each) download on first use.
piper = ["piper-tts>=1.3,<2"]
# The audiobook app: extraction from PDF/EPUB/HTML, .env configuration, the CLI.
app = [
    "python-dotenv>=1.0,<2",
    "pymupdf>=1.26,<2",
    "EbookLib>=0.18,<1",
    "beautifulsoup4>=4.12,<5",
]
# Structured PDF extraction for the app: real heading detection, at the cost of onnxruntime.
pdf-layout = ["echo-tts[app]", "pymupdf4llm>=1.28,<2"]
# Structured extraction for documents the fast path mangles.
docling = ["echo-tts[app]", "docling>=2.115.0"]
gui = ["echo-tts[app]", "PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
echo-audio = "create_audio:main"

[tool.setuptools]
packages = ["echo", "echo.audio", "echo.audio.engines", "echo_app", "echo_app.extractors", "gui"]
# The CLI entry points are top-level modules, not packages. Without listing them
# here they are left out of an install, and the `echo-audio` console script fails
# with ModuleNotFoundError: create_audio.
py-modules = ["create_audio", "bulk_generate", "echo_gui"]

[tool.setuptools.package-data]
echo = ["data/*.csv", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
# Resolve `import echo...` from the repo root, so pytest works from anywhere.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 118

[tool.ruff]
line-length = 118
